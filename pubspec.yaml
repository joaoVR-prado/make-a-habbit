name: make_a_habbit
description: "Seu Aplicativo de Habitos."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.4

dependencies:
  flutter_localizations:
    sdk: flutter
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  hive_ce: ^2.18.0
  hive_ce_flutter: ^2.3.4
  uuid: ^4.5.3
  smooth_page_indicator: ^2.0.1
  awesome_notifications: ^0.11.0
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  fonts:
    - family: KonkhmerSleokchher
      fonts:
        - asset: assets/fonts/KonkhmerSleokchher-Regular.ttf
          weight: 400
