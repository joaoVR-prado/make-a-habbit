name: Build de Produção

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    env:
      PLAY_UPLOAD_KEYSTORE_BASE64: ${{ secrets.PLAY_UPLOAD_KEYSTORE_BASE64 }}
      PLAY_UPLOAD_STORE_PASSWORD: ${{ secrets.PLAY_UPLOAD_STORE_PASSWORD }}
      PLAY_UPLOAD_KEY_ALIAS: ${{ secrets.PLAY_UPLOAD_KEY_ALIAS }}
      PLAY_UPLOAD_KEY_PASSWORD: ${{ secrets.PLAY_UPLOAD_KEY_PASSWORD }}

    steps:
      - name: Exigir a branch principal
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "A release de produção só pode ser gerada a partir da main."
            exit 1
          fi

      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: stable
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Validar segredos de assinatura
        shell: bash
        run: |
          missing=0
          for variable in \
            PLAY_UPLOAD_KEYSTORE_BASE64 \
            PLAY_UPLOAD_STORE_PASSWORD \
            PLAY_UPLOAD_KEY_ALIAS \
            PLAY_UPLOAD_KEY_PASSWORD
          do
            if [[ -z "${!variable}" ]]; then
              echo "Segredo obrigatório ausente: $variable"
              missing=1
            fi
          done
          exit "$missing"

      - name: Preparar chave de upload
        shell: bash
        run: |
          keystore_path="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$PLAY_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          echo "PLAY_UPLOAD_STORE_FILE=$keystore_path" >> "$GITHUB_ENV"

      - name: Remover registrador do plugin de integração
        run: rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java

      - name: Gerar App Bundle assinado e ofuscado
        run: >-
          flutter build appbundle
          --release
          --no-pub
          --obfuscate
          --split-debug-info=build/symbols

      - name: Verificar assinatura do App Bundle
        run: jarsigner -verify build/app/outputs/bundle/release/app-release.aab

      - name: Publicar bundle e símbolos
        uses: actions/upload-artifact@v4
        with:
          name: make-a-habbit-${{ github.sha }}
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/symbols/
          if-no-files-found: error
          retention-days: 90
