name: Flutter CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Check Formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze Code
        run: flutter analyze

      - name: Run Tests with Coverage
        run: flutter test --coverage

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 14

  release-validation:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Remove Test Plugin Registrant
        run: rm -f android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java

      - name: Build Release App Bundle
        run: flutter build appbundle --release --no-pub

      - name: Collect Merged Release Manifest
        run: |
          mkdir -p build/release-audit
          manifest_path=$(find build/app/intermediates/merged_manifests/release -name AndroidManifest.xml -print -quit)
          test -n "$manifest_path"
          cp "$manifest_path" build/release-audit/AndroidManifest.xml

      - name: Upload Release Validation Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-release-validation-artifacts
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/release-audit/AndroidManifest.xml
          if-no-files-found: error
          retention-days: 14
